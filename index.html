<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Última hora · Seguridad de la IA · AI Safety España</title>
<link rel="icon" href="https://aisafety.es/favicon.ico?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --principal: #ff4500;
    --bg: #f2f2f2;
    --fg: #333333;
    --muted: #6f6f6f;
    --border: rgba(51, 51, 51, 0.12);
    --card-bg: #e3e5e5;
    --card-bg-2: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #333333;
      --fg: #f2f2f2;
      --muted: #b3b3b3;
      --border: rgba(242, 242, 242, 0.14);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-bg-2: rgba(255, 255, 255, 0.05);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 20px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Overpass", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  a { color: inherit; }
  nav.topbar {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  nav.topbar .logo img {
    height: 36px;
    width: auto;
    display: block;
  }
  nav.topbar .volver {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--fg);
    border-bottom: 2px solid transparent;
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav.topbar .volver:hover {
    color: var(--principal);
    border-color: var(--principal);
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding-block: 8px 64px;
  }
  header p.eyebrow {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--principal);
    margin: 0 0 8px;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  header p.desc {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.98rem;
    max-width: 60ch;
  }
  h2 {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin: 40px 0 6px;
  }
  h2 .n { font-weight: 600; letter-spacing: 0.04em; }
  /* Controles: categorías, medio y agrupación */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }
  .chip:hover { border-color: var(--principal); }
  .chip[aria-pressed="true"] {
    background: var(--principal);
    border-color: var(--principal);
    color: #fff;
  }
  .chip .n { font-weight: 600; opacity: 0.75; margin-left: 4px; }
  .filtros {
    display: flex;
    align-items: center;
    gap: 12px 18px;
    flex-wrap: wrap;
    margin: 0 0 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .filtros label {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
  }
  .filtros select {
    font: inherit;
    font-weight: 700;
    color: var(--fg);
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    max-width: 100%;
    cursor: pointer;
  }
  .filtros select:hover { border-color: var(--principal); }
  .filtros .agrupar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .filtros .agrupar input { accent-color: var(--principal); width: 16px; height: 16px; cursor: pointer; }
  .conteo {
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  /* Noticias */
  .item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item a {
    text-decoration: none;
    font-weight: 700;
    font-size: 1.02rem;
    display: block;
    margin-bottom: 6px;
    transition: color 0.2s ease;
  }
  .item a:hover { color: var(--principal); }
  .item .meta {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: center;
  }
  .item .meta .fuente {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--principal) 14%, transparent);
    color: var(--principal);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .item .resumen {
    color: var(--muted);
    font-size: 0.94rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 28px 0;
    text-align: center;
  }
  footer {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 52px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  footer a {
    text-decoration: none;
    font-weight: 700;
  }
  footer a:hover { color: var(--principal); }
</style>
</head>
<body>
<nav class="topbar">
  <a class="logo" href="https://aisafety.es" aria-label="AI Safety España">
    <img src="assets/ias_logo.svg" alt="AI Safety España">
  </a>
  <a class="volver" href="https://aisafety.es">← Volver a aisafety.es</a>
</nav>
<main>
  <header>
    <p class="eyebrow">/ Última hora</p>
    <h1>Noticias de seguridad de la IA</h1>
    <p class="desc">Todo lo publicado en los últimos 7 días por laboratorios, organizaciones de seguridad y gobernanza, boletines y prensa, traducido al español y ordenado por fecha.</p>
  </header>

  <section id="controles" hidden>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
    <div class="filtros">
      <label for="filtro-medio">Medio</label>
      <select id="filtro-medio"></select>
      <label class="agrupar"><input type="checkbox" id="agrupar-medio"> Agrupar por medio</label>
    </div>
    <p id="conteo" class="conteo"></p>
  </section>

  <div id="noticias"></div>
  <p id="status" class="status">Cargando noticias…</p>

  <footer>
    Generado por <a href="https://github.com/hitchhikergalactic/ultima-hora-ias" target="_blank" rel="noopener">ultima-hora-ias</a>.
  </footer>
</main>

<script>
  var CATEGORIAS = [
    ['todas', 'Todas'],
    ['laboratorio', 'Laboratorios'],
    ['seguridad', 'Seguridad y gobernanza'],
    ['boletin', 'Boletines'],
    ['prensa', 'Prensa']
  ];
  var etiquetaCategoria = { laboratorio: 'Laboratorio', seguridad: 'Seguridad y gobernanza', boletin: 'Boletín', prensa: 'Prensa' };

  var todas = [];
  var informe = null;
  var estado = { categoria: 'todas', medio: 'todos', agrupar: false };

  function decodeEntities(str) {
    if (!str) return str;
    var txt = document.createElement('textarea');
    txt.innerHTML = str;
    return txt.value;
  }

  function fechaLarga(fecha) {
    var d = new Date(fecha);
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function hora(fecha) {
    return new Date(fecha).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  function claveDia(fecha) {
    var d = new Date(fecha);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function tituloDia(fecha) {
    var texto = new Date(fecha).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function span(clase, texto) {
    var el = document.createElement('span');
    if (clase) el.className = clase;
    el.textContent = texto;
    return el;
  }

  function nodoNoticia(n, mostrarFechaCompleta) {
    var div = document.createElement('div');
    div.className = 'item';

    var a = document.createElement('a');
    a.href = n.enlace;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = decodeEntities(n.titulo) || '(sin título)';
    div.appendChild(a);

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.appendChild(span('fuente', n.medio));
    meta.appendChild(span('', mostrarFechaCompleta ? fechaLarga(n.fecha) : hora(n.fecha)));
    meta.appendChild(span('', etiquetaCategoria[n.categoria] || n.categoria));
    if (n.laboratorio && n.publicador) meta.appendChild(span('', n.laboratorio));
    if (n.traducido === false) meta.appendChild(span('', '(sin traducir)'));
    div.appendChild(meta);

    if (n.resumen) {
      var p = document.createElement('div');
      p.className = 'resumen';
      p.textContent = decodeEntities(n.resumen);
      div.appendChild(p);
    }
    return div;
  }

  function encabezado(texto, cuantas) {
    var h = document.createElement('h2');
    h.appendChild(document.createTextNode(texto + ' '));
    h.appendChild(span('n', '· ' + cuantas));
    return h;
  }

  function coincideCategoria(n) { return estado.categoria === 'todas' || n.categoria === estado.categoria; }
  function coincideMedio(n) { return estado.medio === 'todos' || n.medio === estado.medio; }

  function pintarChips() {
    var cont = document.getElementById('chips');
    cont.innerHTML = '';
    var base = todas.filter(coincideMedio);
    CATEGORIAS.forEach(function (c) {
      var cuantas = c[0] === 'todas' ? base.length : base.filter(function (n) { return n.categoria === c[0]; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('aria-pressed', String(estado.categoria === c[0]));
      b.appendChild(document.createTextNode(c[1]));
      b.appendChild(span('n', String(cuantas)));
      b.addEventListener('click', function () {
        estado.categoria = c[0];
        pintar();
      });
      cont.appendChild(b);
    });
  }

  function pintarSelectorMedio() {
    var sel = document.getElementById('filtro-medio');
    var cuenta = {};
    todas.filter(coincideCategoria).forEach(function (n) { cuenta[n.medio] = (cuenta[n.medio] || 0) + 1; });
    var medios = Object.keys(cuenta).sort(function (a, b) { return a.localeCompare(b, 'es'); });
    if (estado.medio !== 'todos' && !cuenta[estado.medio]) estado.medio = 'todos';
    sel.innerHTML = '';
    var todos = document.createElement('option');
    todos.value = 'todos';
    todos.textContent = 'Todos los medios (' + medios.length + ')';
    sel.appendChild(todos);
    medios.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m;
      o.textContent = m + ' (' + cuenta[m] + ')';
      sel.appendChild(o);
    });
    sel.value = estado.medio;
  }

  function pintarNoticias(visibles) {
    var cont = document.getElementById('noticias');
    cont.innerHTML = '';
    var grupos = [];
    var indice = {};
    visibles.forEach(function (n) {
      var clave = estado.agrupar ? n.medio : claveDia(n.fecha);
      if (!(clave in indice)) {
        indice[clave] = grupos.length;
        grupos.push({ titulo: estado.agrupar ? n.medio : tituloDia(n.fecha), noticias: [] });
      }
      grupos[indice[clave]].noticias.push(n);
    });
    // Por día: los días ya salen en orden (las noticias vienen por fecha descendente).
    // Por medio: primero el medio con la noticia más reciente.
    grupos.forEach(function (g) {
      var bloque = document.createElement('section');
      bloque.appendChild(encabezado(g.titulo, g.noticias.length));
      g.noticias.forEach(function (n) { bloque.appendChild(nodoNoticia(n, estado.agrupar)); });
      cont.appendChild(bloque);
    });
    if (grupos.length === 0) {
      var vacio = document.createElement('p');
      vacio.className = 'status';
      vacio.textContent = 'No hay noticias con estos filtros.';
      cont.appendChild(vacio);
    }
  }

  function pintar() {
    pintarSelectorMedio();
    pintarChips();
    var visibles = todas.filter(function (n) { return coincideCategoria(n) && coincideMedio(n); });
    var texto = 'Mostrando ' + visibles.length + ' de ' + todas.length + ' noticias de los últimos 7 días.';
    if (informe && informe.generado) texto += ' Actualizado: ' + fechaLarga(informe.generado) + '.';
    document.getElementById('conteo').textContent = texto;
    pintarNoticias(visibles);
  }

  function fetchJSON(ruta) {
    return fetch(ruta, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error(ruta + ': ' + res.status);
      return res.json();
    });
  }

  Promise.allSettled([fetchJSON('data/latest.json'), fetchJSON('data/informe-latest.json')]).then(function (r) {
    var status = document.getElementById('status');
    if (r[0].status !== 'fulfilled' || !Array.isArray(r[0].value)) {
      status.textContent = 'No se han podido cargar las noticias ahora mismo.';
      return;
    }
    todas = r[0].value.filter(function (n) { return n.fecha; }).sort(function (a, b) {
      return new Date(b.fecha) - new Date(a.fecha);
    });
    informe = r[1].status === 'fulfilled' ? r[1].value : null;

    document.getElementById('filtro-medio').addEventListener('change', function (e) {
      estado.medio = e.target.value;
      pintar();
    });
    document.getElementById('agrupar-medio').addEventListener('change', function (e) {
      estado.agrupar = e.target.checked;
      pintar();
    });
    document.getElementById('controles').hidden = false;
    status.hidden = true;
    pintar();
  });
</script>
</body>
</html>
