<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Última hora · Seguridad de la IA · AI Safety España</title>
<link rel="icon" href="https://aisafety.es/favicon.ico?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --principal: #ff4500;
    --bg: #f2f2f2;
    --fg: #333333;
    --muted: #6f6f6f;
    --border: rgba(51, 51, 51, 0.12);
    --card-bg: #e3e5e5;
    --card-bg-2: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #333333;
      --fg: #f2f2f2;
      --muted: #b3b3b3;
      --border: rgba(242, 242, 242, 0.14);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-bg-2: rgba(255, 255, 255, 0.05);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 20px;
    background: var(--bg);
    color: var(--fg);
    font-family: "Overpass", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.55;
    transition: background-color 0.4s ease, color 0.4s ease;
  }
  a { color: inherit; }
  nav.topbar {
    max-width: 820px;
    margin: 0 auto;
    padding: 20px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  nav.topbar .logo img {
    height: 36px;
    width: auto;
    display: block;
  }
  nav.topbar .volver {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--fg);
    border-bottom: 2px solid transparent;
    padding-bottom: 3px;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  nav.topbar .volver:hover {
    color: var(--principal);
    border-color: var(--principal);
  }
  main {
    max-width: 820px;
    margin: 0 auto;
    padding-block: 8px 64px;
  }
  header p.eyebrow {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--principal);
    margin: 0 0 8px;
  }
  header h1 {
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    font-weight: 900;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  header p.desc {
    color: var(--muted);
    margin: 0 0 28px;
    font-size: 0.98rem;
    max-width: 60ch;
  }
  h2 {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin: 40px 0 6px;
  }
  h2 .n { font-weight: 600; letter-spacing: 0.04em; }
  /* Controles: categorías, medio y agrupación */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 0 0 16px;
  }
  .chip {
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
  }
  .chip:hover { border-color: var(--principal); }
  .chip[aria-pressed="true"] {
    background: var(--principal);
    border-color: var(--principal);
    color: #fff;
  }
  .chip .n { font-weight: 600; opacity: 0.75; margin-left: 4px; }
  .filtros {
    display: flex;
    align-items: center;
    gap: 12px 18px;
    flex-wrap: wrap;
    margin: 0 0 14px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .filtros label {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
  }
  .filtros select {
    font: inherit;
    font-weight: 700;
    color: var(--fg);
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    max-width: 100%;
    cursor: pointer;
  }
  .filtros select:hover { border-color: var(--principal); }
  .filtros .agrupar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .filtros .agrupar input { accent-color: var(--principal); width: 16px; height: 16px; cursor: pointer; }
  .filtros input[type="search"],
  .filtros input[type="date"] {
    font: inherit;
    font-weight: 700;
    color: var(--fg);
    background: var(--card-bg-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    max-width: 100%;
  }
  .filtros input[type="search"] { min-width: 200px; flex: 1 1 200px; }
  .filtros input[type="search"]:hover, .filtros input[type="search"]:focus,
  .filtros input[type="date"]:hover, .filtros input[type="date"]:focus { border-color: var(--principal); }
  .filtros.busqueda { margin-bottom: 14px; }
  .filtros .limpiar {
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--principal);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .conteo {
    margin: 0 0 8px;
    font-size: 0.82rem;
    color: var(--muted);
  }
  /* Noticias */
  .item {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item a {
    text-decoration: none;
    font-weight: 700;
    font-size: 1.02rem;
    display: block;
    margin-bottom: 6px;
    transition: color 0.2s ease;
  }
  .item a:hover { color: var(--principal); }
  .item .meta {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
    align-items: center;
  }
  .item .meta .fuente {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--principal) 14%, transparent);
    color: var(--principal);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .item .resumen {
    color: var(--muted);
    font-size: 0.94rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .status {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 28px 0;
    text-align: center;
  }
  footer {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 52px;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  footer a {
    text-decoration: none;
    font-weight: 700;
  }
  footer a:hover { color: var(--principal); }
</style>
</head>
<body>
<nav class="topbar">
  <a class="logo" href="https://aisafety.es" aria-label="AI Safety España">
    <img src="assets/ias_logo.svg" alt="AI Safety España">
  </a>
  <a class="volver" href="https://aisafety.es">← Volver a aisafety.es</a>
</nav>
<main>
  <header>
    <p class="eyebrow">/ Última hora</p>
    <h1>Noticias de seguridad de la IA</h1>
    <p class="desc">Todo lo publicado en los últimos 7 días por laboratorios, organizaciones de seguridad y gobernanza, boletines y prensa, traducido al español y ordenado por fecha.</p>
  </header>

  <section id="controles" hidden>
    <div class="filtros busqueda">
      <label for="busqueda-texto">Buscar</label>
      <input type="search" id="busqueda-texto" placeholder="Palabra clave, p. ej. Hugging Face">
      <label for="busqueda-fecha">Fecha</label>
      <input type="date" id="busqueda-fecha">
      <label class="agrupar"><input type="checkbox" id="busqueda-semana"> Toda la semana</label>
      <button type="button" id="busqueda-limpiar" class="limpiar" hidden>Volver a los últimos 7 días</button>
    </div>
    <div id="controles-reciente">
      <div class="chips" id="chips" role="group" aria-label="Filtrar por categoría"></div>
      <div class="filtros">
        <label for="filtro-medio">Medio</label>
        <select id="filtro-medio"></select>
        <label class="agrupar"><input type="checkbox" id="agrupar-medio"> Agrupar por medio</label>
      </div>
    </div>
    <p id="conteo" class="conteo"></p>
  </section>

  <div id="noticias"></div>
  <p id="status" class="status">Cargando noticias…</p>

  <footer>
    Generado por <a href="https://github.com/hitchhikergalactic/ultima-hora-ias" target="_blank" rel="noopener">ultima-hora-ias</a>.
  </footer>
</main>

<script>
  var CATEGORIAS = [
    ['todas', 'Todas'],
    ['laboratorio', 'Laboratorios'],
    ['seguridad', 'Seguridad y gobernanza'],
    ['boletin', 'Boletines'],
    ['prensa', 'Prensa']
  ];
  var etiquetaCategoria = { laboratorio: 'Laboratorio', seguridad: 'Seguridad y gobernanza', boletin: 'Boletín', prensa: 'Prensa' };

  var todas = [];
  var informe = null;
  var estado = { categoria: 'todas', medio: 'todos', agrupar: false, modo: 'reciente', texto: '', fecha: '', semana: false };

  // --- Histórico: fetch perezoso, cacheado en memoria, para la búsqueda ------------
  var indiceHistorico = null;
  var cacheMeses = {};

  function pad2(n) { return n < 10 ? '0' + n : String(n); }
  function fechaLocalISO(d) {
    d = (d instanceof Date) ? d : new Date(d);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  // Lunes-domingo (hora local) de la semana de `fechaStr` ("AAAA-MM-DD").
  function semanaDe(fechaStr) {
    var d = new Date(fechaStr + 'T00:00:00');
    var offset = (d.getDay() + 6) % 7; // 0 = lunes
    var lunes = new Date(d); lunes.setDate(d.getDate() - offset);
    var domingo = new Date(lunes); domingo.setDate(lunes.getDate() + 6);
    return { desde: lunes, hasta: domingo };
  }
  // Meses (histórico se archiva en UTC) que hay que pedir para cubrir [desde, hasta]
  // en hora local, con un día de margen a cada lado por si el desfase horario cambia
  // el mes en UTC.
  function mesesParaRango(desde, hasta) {
    var ini = new Date(desde); ini.setDate(ini.getDate() - 1);
    var fin = new Date(hasta); fin.setDate(fin.getDate() + 1);
    var meses = [];
    var cursor = new Date(ini.getFullYear(), ini.getMonth(), 1);
    var limite = new Date(fin.getFullYear(), fin.getMonth(), 1);
    while (cursor <= limite) {
      meses.push(cursor.getFullYear() + '-' + pad2(cursor.getMonth() + 1));
      cursor.setMonth(cursor.getMonth() + 1);
    }
    return meses;
  }
  function fetchIndiceHistorico() {
    if (indiceHistorico) return Promise.resolve(indiceHistorico);
    return fetchJSON('data/historico/indice.json')
      .then(function (idx) { indiceHistorico = idx; return idx; })
      .catch(function () { indiceHistorico = { meses: [] }; return indiceHistorico; });
  }
  function fetchMes(mes) {
    if (cacheMeses[mes]) return Promise.resolve(cacheMeses[mes]);
    return fetchJSON('data/historico/' + mes + '.json')
      .then(function (arr) { cacheMeses[mes] = arr; return arr; })
      .catch(function () { cacheMeses[mes] = []; return []; });
  }
  // Todo el histórico (para una búsqueda por palabra clave sin fecha).
  function fetchTodoElHistorico() {
    return fetchIndiceHistorico().then(function (idx) {
      return Promise.all(idx.meses.map(fetchMes)).then(function (listas) {
        return listas.reduce(function (a, b) { return a.concat(b); }, []);
      });
    });
  }

  function normalizarTexto(s) {
    return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  }
  function coincideTexto(n, q) {
    return normalizarTexto(n.titulo).indexOf(q) !== -1 || normalizarTexto(n.resumen || '').indexOf(q) !== -1;
  }

  function decodeEntities(str) {
    if (!str) return str;
    var txt = document.createElement('textarea');
    txt.innerHTML = str;
    return txt.value;
  }

  function fechaLarga(fecha) {
    var d = new Date(fecha);
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function hora(fecha) {
    return new Date(fecha).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
  }
  function claveDia(fecha) {
    var d = new Date(fecha);
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function tituloDia(fecha) {
    var texto = new Date(fecha).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  function span(clase, texto) {
    var el = document.createElement('span');
    if (clase) el.className = clase;
    el.textContent = texto;
    return el;
  }

  function nodoNoticia(n, mostrarFechaCompleta) {
    var div = document.createElement('div');
    div.className = 'item';

    var a = document.createElement('a');
    a.href = n.enlace;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = decodeEntities(n.titulo) || '(sin título)';
    div.appendChild(a);

    var meta = document.createElement('div');
    meta.className = 'meta';
    meta.appendChild(span('fuente', n.medio));
    meta.appendChild(span('', mostrarFechaCompleta ? fechaLarga(n.fecha) : hora(n.fecha)));
    meta.appendChild(span('', etiquetaCategoria[n.categoria] || n.categoria));
    if (n.laboratorio && n.publicador) meta.appendChild(span('', n.laboratorio));
    if (n.traducido === false) meta.appendChild(span('', '(sin traducir)'));
    div.appendChild(meta);

    if (n.resumen) {
      var p = document.createElement('div');
      p.className = 'resumen';
      p.textContent = decodeEntities(n.resumen);
      div.appendChild(p);
    }
    return div;
  }

  function encabezado(texto, cuantas) {
    var h = document.createElement('h2');
    h.appendChild(document.createTextNode(texto + ' '));
    h.appendChild(span('n', '· ' + cuantas));
    return h;
  }

  function coincideCategoria(n) { return estado.categoria === 'todas' || n.categoria === estado.categoria; }
  function coincideMedio(n) { return estado.medio === 'todos' || n.medio === estado.medio; }

  function pintarChips() {
    var cont = document.getElementById('chips');
    cont.innerHTML = '';
    var base = todas.filter(coincideMedio);
    CATEGORIAS.forEach(function (c) {
      var cuantas = c[0] === 'todas' ? base.length : base.filter(function (n) { return n.categoria === c[0]; }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('aria-pressed', String(estado.categoria === c[0]));
      b.appendChild(document.createTextNode(c[1]));
      b.appendChild(span('n', String(cuantas)));
      b.addEventListener('click', function () {
        estado.categoria = c[0];
        pintar();
      });
      cont.appendChild(b);
    });
  }

  function pintarSelectorMedio() {
    var sel = document.getElementById('filtro-medio');
    var cuenta = {};
    todas.filter(coincideCategoria).forEach(function (n) { cuenta[n.medio] = (cuenta[n.medio] || 0) + 1; });
    var medios = Object.keys(cuenta).sort(function (a, b) { return a.localeCompare(b, 'es'); });
    if (estado.medio !== 'todos' && !cuenta[estado.medio]) estado.medio = 'todos';
    sel.innerHTML = '';
    var todos = document.createElement('option');
    todos.value = 'todos';
    todos.textContent = 'Todos los medios (' + medios.length + ')';
    sel.appendChild(todos);
    medios.forEach(function (m) {
      var o = document.createElement('option');
      o.value = m;
      o.textContent = m + ' (' + cuenta[m] + ')';
      sel.appendChild(o);
    });
    sel.value = estado.medio;
  }

  function pintarNoticias(visibles, agruparPorMedio, mensajeVacio) {
    var cont = document.getElementById('noticias');
    cont.innerHTML = '';
    var grupos = [];
    var indice = {};
    visibles.forEach(function (n) {
      var clave = agruparPorMedio ? n.medio : claveDia(n.fecha);
      if (!(clave in indice)) {
        indice[clave] = grupos.length;
        grupos.push({ titulo: agruparPorMedio ? n.medio : tituloDia(n.fecha), noticias: [] });
      }
      grupos[indice[clave]].noticias.push(n);
    });
    // Por día: los días ya salen en orden (las noticias vienen por fecha descendente).
    // Por medio: primero el medio con la noticia más reciente.
    grupos.forEach(function (g) {
      var bloque = document.createElement('section');
      bloque.appendChild(encabezado(g.titulo, g.noticias.length));
      g.noticias.forEach(function (n) { bloque.appendChild(nodoNoticia(n, agruparPorMedio)); });
      cont.appendChild(bloque);
    });
    if (grupos.length === 0) {
      var vacio = document.createElement('p');
      vacio.className = 'status';
      vacio.textContent = mensajeVacio || 'No hay noticias con estos filtros.';
      cont.appendChild(vacio);
    }
  }

  function pintar() {
    document.getElementById('controles-reciente').hidden = false;
    pintarSelectorMedio();
    pintarChips();
    var visibles = todas.filter(function (n) { return coincideCategoria(n) && coincideMedio(n); });
    var texto = 'Mostrando ' + visibles.length + ' de ' + todas.length + ' noticias de los últimos 7 días.';
    if (informe && informe.generado) texto += ' Actualizado: ' + fechaLarga(informe.generado) + '.';
    document.getElementById('conteo').textContent = texto;
    pintarNoticias(visibles, estado.agrupar);
  }

  // --- Búsqueda por palabra clave y/o por fecha (mira todo el histórico) ----------

  function fechaCorta(fechaISOsinHora) {
    return new Date(fechaISOsinHora + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'long' });
  }
  function descripcionBusqueda() {
    var partes = [];
    if (estado.texto) partes.push('con "' + estado.texto + '"');
    if (estado.fecha) {
      if (estado.semana) partes.push('de la semana del ' + fechaCorta(estado.semanaDesde) + ' al ' + fechaCorta(estado.semanaHasta));
      else partes.push('del ' + tituloDia(estado.fecha + 'T12:00:00').toLowerCase());
    }
    return partes.join(' ');
  }

  function coincideFechaBusqueda(n) {
    if (!estado.fecha) return true;
    var f = fechaLocalISO(n.fecha);
    return estado.semana ? (f >= estado.semanaDesde && f <= estado.semanaHasta) : f === estado.fecha;
  }

  function pintarBusqueda(origen) {
    var q = normalizarTexto(estado.texto);
    var resultado = origen
      .filter(function (n) { return coincideFechaBusqueda(n) && (!q || coincideTexto(n, q)); })
      .sort(function (a, b) { return new Date(b.fecha) - new Date(a.fecha); });
    document.getElementById('conteo').textContent = 'Encontradas ' + resultado.length + ' noticia(s) ' + descripcionBusqueda() + '.';
    pintarNoticias(resultado, false, 'No hay noticias ' + descripcionBusqueda() + '.');
  }

  function actualizarBusqueda() {
    var texto = document.getElementById('busqueda-texto').value.trim();
    var fecha = document.getElementById('busqueda-fecha').value;
    var semana = document.getElementById('busqueda-semana').checked;
    estado.texto = texto;
    estado.fecha = fecha;
    estado.semana = semana;
    document.getElementById('busqueda-limpiar').hidden = !(texto || fecha);

    if (!texto && !fecha) {
      estado.modo = 'reciente';
      pintar();
      return;
    }
    estado.modo = 'busqueda';
    document.getElementById('controles-reciente').hidden = true;
    document.getElementById('conteo').textContent = 'Buscando…';
    document.getElementById('noticias').innerHTML = '';

    if (fecha) {
      var rango = semana ? semanaDe(fecha) : { desde: new Date(fecha + 'T00:00:00'), hasta: new Date(fecha + 'T00:00:00') };
      estado.semanaDesde = fechaLocalISO(rango.desde);
      estado.semanaHasta = fechaLocalISO(rango.hasta);
      var meses = mesesParaRango(rango.desde, rango.hasta);
      Promise.all(meses.map(fetchMes)).then(function (listas) {
        pintarBusqueda(listas.reduce(function (a, b) { return a.concat(b); }, []));
      });
    } else {
      fetchTodoElHistorico().then(pintarBusqueda);
    }
  }

  function limpiarBusqueda() {
    document.getElementById('busqueda-texto').value = '';
    document.getElementById('busqueda-fecha').value = '';
    document.getElementById('busqueda-semana').checked = false;
    document.getElementById('busqueda-limpiar').hidden = true;
    estado.modo = 'reciente';
    estado.texto = '';
    estado.fecha = '';
    estado.semana = false;
    pintar();
  }

  function fetchJSON(ruta) {
    return fetch(ruta, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error(ruta + ': ' + res.status);
      return res.json();
    });
  }

  Promise.allSettled([fetchJSON('data/latest.json'), fetchJSON('data/informe-latest.json')]).then(function (r) {
    var status = document.getElementById('status');
    if (r[0].status !== 'fulfilled' || !Array.isArray(r[0].value)) {
      status.textContent = 'No se han podido cargar las noticias ahora mismo.';
      return;
    }
