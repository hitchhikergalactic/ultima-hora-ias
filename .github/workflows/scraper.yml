name: Actualizar noticias IA

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Ejecutar el scraper
        run: node scraper.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}

      # Comprueba que la publicación es coherente y que está fresca: si hay noticias
      # de las últimas 24 h en los feeds tiene que haber alguna publicada. Si falla,
      # no se publica nada.
      - name: Verificar el contenido
        run: node scripts/verificar.mjs --contenido

      # Feeds y traducción se comprueban ANTES de abrir el PR: el paso siguiente
      # devuelve el directorio a la rama base y dejaría esta comprobación leyendo
      # los datos viejos. No impide publicar: el resultado se guarda y el
      # workflow falla al final (ver el último paso).
      - name: Comprobar feeds y traducción
        id: feeds
        continue-on-error: true
        run: node scripts/verificar.mjs --feeds --traduccion

      # No se comitea directo a main: esta acción crea una rama y abre
      # un pull request, que el paso siguiente fusiona. Si el scraper falla
      # (sin saldo en la API, feeds caídos...) termina con error, este paso
      # no se ejecuta y no se publica nada.
      - name: Abrir pull request con las noticias del día
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'Actualiza noticias IA del día'
          branch: actualizacion-noticias
          delete-branch: true
          title: 'Actualización automática de noticias IA'
          body: |
            Pull request generado automáticamente por el scraper (`scraper.js`).

            Se fusiona automáticamente a `main` al terminar el workflow.
          add-paths: |
            data/*.json
            data/historico/*.json

      # Sin cambios en los datos no hay PR y este paso se salta.
      - name: Fusionar el pull request
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --repo "${{ github.repository }}" --squash --delete-branch

      # Va DESPUÉS de publicar: si algún feed devolvió 0 ítems, si uno que ayer
      # devolvía ítems hoy devuelve 0, o si quedó algo sin traducir, el workflow
      # termina en rojo (y GitHub avisa por correo) sin haber impedido publicar el resto.
      - name: Fallar si algún feed o la traducción fallaron
        if: steps.feeds.outcome == 'failure'
        run: |
          echo "::error::Algún feed devolvió 0 ítems, se cayó respecto a ayer o quedó algo sin traducir (ver el paso 'Comprobar feeds y traducción')."
          exit 1
